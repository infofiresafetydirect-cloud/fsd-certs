<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FSD Certificate Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="apple-mobile-web-app-title" content="FSD Cert Portal">
  <meta name="application-name" content="FSD Certificate Portal">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0e5f83">

  <link rel="apple-touch-icon" sizes="180x180" href="fsd-icon.png">
  <link rel="icon" type="image/png" href="fsd-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.95), rgba(255,255,255,0.18) 28%, transparent 48%),
        linear-gradient(145deg, #c9f4ff 0%, #55b9d7 42%, #0e5f83 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .shell {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 18px;
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.38);
      color: #07324a;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    .card {
      width: 100%;
      text-align: center;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.42), rgba(255,255,255,0.18));
      border: 1px solid rgba(255,255,255,0.46);
      border-radius: 34px;
      padding: 38px 30px 30px;
      box-shadow:
        0 28px 80px rgba(0, 60, 90, 0.28),
        inset 0 1px 0 rgba(255,255,255,0.50);
      backdrop-filter: blur(18px);
    }

    .icon-wrap {
      width: 178px;
      height: 178px;
      margin: 0 auto 24px;
      padding: 10px;
      border-radius: 44px;
      background: linear-gradient(145deg, rgba(255,255,255,0.72), rgba(255,255,255,0.18));
      box-shadow:
        0 18px 42px rgba(0, 60, 90, 0.28),
        inset 0 1px 0 rgba(255,255,255,0.70);
    }

    img {
      width: 158px;
      height: 158px;
      border-radius: 36px;
      object-fit: cover;
      display: block;
      box-shadow: 0 12px 30px rgba(0, 60, 90, 0.28);
      background: #0b1f3a;
    }

    h1 {
      margin: 0;
      font-size: 38px;
      line-height: 1.08;
      letter-spacing: -1px;
      font-weight: 900;
      color: #062b40;
      text-shadow: 0 1px 0 rgba(255,255,255,0.45);
    }

    .subtitle {
      margin: 14px auto 30px;
      max-width: 430px;
      color: rgba(6, 43, 64, 0.82);
      line-height: 1.45;
      font-size: 17px;
      font-weight: 600;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 64px;
      padding: 18px 20px;
      border-radius: 20px;
      background: linear-gradient(180deg, #e3153c, #b90927);
      color: white;
      text-decoration: none;
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 0.2px;
      box-shadow:
        0 16px 34px rgba(200,16,46,0.32),
        inset 0 1px 0 rgba(255,255,255,0.28);
      border: 1px solid rgba(255,255,255,0.20);
    }

    .button:active {
      transform: scale(0.98);
    }

    .secondary {
      margin-top: 14px;
      background: linear-gradient(180deg, rgba(6,43,64,0.84), rgba(6,43,64,0.68));
      box-shadow: 0 12px 26px rgba(0, 60, 90, 0.18);
      border: 1px solid rgba(255,255,255,0.28);
      font-size: 17px;
      min-height: 56px;
    }

    .third {
      margin-top: 14px;
      background: linear-gradient(180deg, #147ea1, #075676);
      box-shadow: 0 12px 26px rgba(0, 60, 90, 0.22);
      border: 1px solid rgba(255,255,255,0.28);
      font-size: 17px;
      min-height: 56px;
    }

    .small {
      margin-top: 24px;
      font-size: 13px;
      color: rgba(6, 43, 64, 0.68);
      font-weight: 700;
    }

    @media (max-width: 520px) {
      body {
        padding: 18px;
      }

      .card {
        padding: 30px 20px 24px;
        border-radius: 28px;
      }

      h1 {
        font-size: 31px;
      }

      .icon-wrap {
        width: 150px;
        height: 150px;
        border-radius: 36px;
      }

      img {
        width: 130px;
        height: 130px;
        border-radius: 30px;
      }

      .subtitle {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="shell">
    <div class="badge">✅ Fire Safety Direct · Service Certificate Portal</div>

    <section class="card">
      <div class="icon-wrap">
        <img src="fsd-icon.png" alt="FSD Certificate Portal icon">
      </div>

      <h1>FSD Certificate Portal</h1>

      <p class="subtitle">
        Fire Safety Direct’s online service certificates and engineer reporting system.
      </p>

      <a
        class="button"
        href="https://script.google.com/macros/s/AKfycbzq9FTETNZwUJWHMGnMHECbu3sJ3jy3FFvGYyeaRXtkoK1GHBtqOu-GLBle_WGfoFtI/exec"
      >
        Open Certificate Portal
      </a>

      <a
        class="button secondary"
        href="https://docs.google.com/spreadsheets/d/1SZK6igtKPVHcBRdkA49A6AKSobkWXI_pk-De7taZP6c/edit"
      >
        Open FSD Schedule
      </a>

      <a
        class="button third"
        href="https://docs.google.com/spreadsheets/d/1-lKMU6LIhW7oiWHskTZcbYFhjQCN6nZoSydLxq5A-Fc/edit?gid=720000000#gid=720000000"
      >
        Open FSD Reports Sheet
      </a>

      <div class="small">FSD Certificate Portal · Built by Jared720 Labs</div>
    </section>
  </main>
</body>
</html>
