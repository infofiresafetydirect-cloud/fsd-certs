<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FSD Certs">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#991b1b">
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">

  <title>FSD Certs</title>

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="apple-touch-icon.png">

  <style>
    :root {
      --fsd-red: #991b1b;
      --fsd-red-bright: #dc2626;
      --fsd-dark: #111827;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    .shell {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #ffffff;
      overflow: hidden;
    }

    .top-safe-fill {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--safe-top);
      background: linear-gradient(135deg, var(--fsd-red-bright), var(--fsd-red));
      z-index: 5;
      pointer-events: none;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
      display: block;
    }

    .loader,
    .fallback {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(22px + var(--safe-top)) calc(22px + var(--safe-right)) calc(22px + var(--safe-bottom)) calc(22px + var(--safe-left));
      box-sizing: border-box;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      color: var(--fsd-dark);
      z-index: 10;
      transition: opacity .18s ease, visibility .18s ease;
    }

    .loader.hidden,
    .fallback.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .panel {
      width: min(420px, 100%);
      text-align: center;
    }

    .logo {
      width: 86px;
      height: 86px;
      border-radius: 24px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--fsd-red-bright), var(--fsd-red));
      color: #ffffff;
      font-weight: 950;
      font-size: 28px;
      letter-spacing: -.04em;
      box-shadow: 0 18px 44px rgba(153, 27, 27, .28);
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.05;
      color: var(--fsd-red);
      letter-spacing: -.04em;
    }

    p {
      margin: 10px 0 0;
      color: #4b5563;
      font-size: 15px;
      line-height: 1.4;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 4px solid #fee2e2;
      border-top-color: var(--fsd-red);
      border-radius: 999px;
      margin: 22px auto 0;
      animation: spin .85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }

    button,
    a.button {
      display: block;
      width: 100%;
      min-height: 52px;
      box-sizing: border-box;
      border: 0;
      border-radius: 16px;
      padding: 15px 16px;
      background: linear-gradient(135deg, var(--fsd-red-bright), var(--fsd-red));
      color: #ffffff;
      font: inherit;
      font-weight: 850;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(153, 27, 27, .2);
    }

    button.secondary,
    a.button.secondary {
      background: linear-gradient(135deg, #4b5563, #1f2937);
      box-shadow: 0 10px 24px rgba(17, 24, 39, .16);
    }
  </style>
</head>
<body>
  <!--
    Fire Safety Direct - FSD Certs V6.3c36p iPad App Shell Mode
    Replace the GitHub Pages index.html with this file.
    Keep the Apps Script engine on V6.3c36o unless you choose to patch it separately.
  -->

  <div class="shell" aria-label="FSD Certs App Shell">
    <div class="top-safe-fill"></div>
    <iframe
      id="fsdFrame"
      title="FSD Certs"
      src="https://script.google.com/macros/s/AKfycbzq9FTETNZwUJWHMGnMHECbu3sJ3jy3FFvGYyeaRXtkoK1GHBtqOu-GLBle_WGfoFtI/exec?shell=ipad"
      allow="camera *; microphone *; clipboard-read *; clipboard-write *; fullscreen *"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

  <div id="loader" class="loader">
    <div class="panel">
      <div class="logo">FSD</div>
      <h1>FSD Certs</h1>
      <p>Loading the certificate system…</p>
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </div>

  <div id="fallback" class="fallback hidden">
    <div class="panel">
      <div class="logo">FSD</div>
      <h1>Still loading?</h1>
      <p>If iPad Safari is being awkward, reload the shell or open the cert system directly.</p>
      <div class="actions">
        <button type="button" onclick="reloadApp()">Reload FSD Certs</button>
        <a class="button secondary" href="https://script.google.com/macros/s/AKfycbzq9FTETNZwUJWHMGnMHECbu3sJ3jy3FFvGYyeaRXtkoK1GHBtqOu-GLBle_WGfoFtI/exec" target="_self" rel="noopener">Open Direct</a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const APP_URL = 'https://script.google.com/macros/s/AKfycbzq9FTETNZwUJWHMGnMHECbu3sJ3jy3FFvGYyeaRXtkoK1GHBtqOu-GLBle_WGfoFtI/exec';
      const frame = document.getElementById('fsdFrame');
      const loader = document.getElementById('loader');
      const fallback = document.getElementById('fallback');

      let loaded = false;

      function hideLoader() {
        loaded = true;
        loader.classList.add('hidden');
      }

      function showFallback() {
        if (!loaded) fallback.classList.remove('hidden');
      }

      window.reloadApp = function reloadApp() {
        fallback.classList.add('hidden');
        loader.classList.remove('hidden');
        loaded = false;
        frame.src = APP_URL + '?shell=ipad&reload=' + Date.now();
        setTimeout(showFallback, 12000);
      };

      frame.addEventListener('load', function () {
        setTimeout(hideLoader, 250);
      });

      setTimeout(showFallback, 12000);

      document.addEventListener('gesturestart', function (event) {
        event.preventDefault();
      });
    }());
  </script>
</body>
</html>
